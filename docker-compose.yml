services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
  server:
    build: .
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017/seatboard
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-90}
      ENABLE_NAIVE: ${ENABLE_NAIVE:-false}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      mongo:
        condition: service_healthy
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [server]
  race:
    build: .
    profiles: [tools]
    environment:
      MONGO_URL: mongodb://mongo:27017/seatboard
      API_URL: http://server:3000
      ROUNDS: ${ROUNDS:-300}
      CONTENDERS: ${CONTENDERS:-2}
      NAIVE: ${NAIVE:-false}
    depends_on:
      mongo:
        condition: service_healthy
      server:
        condition: service_started
    command: ["node", "scripts/race.js"]
volumes:
  mongo-data:
